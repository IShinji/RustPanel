name: Release CI & Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  deployments: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NODE_OPTIONS: '--no-deprecation'
  BACKEND_IMAGE_PLATFORM: linux/amd64
  BACKEND_IMAGE_CACHE_NAME: backend-image
  BACKEND_IMAGE_CACHE_FAMILY: rust-backend-linux-amd64-v1
  BUILDKIT_CACHE_PROJECT: rustpanel
  BUILDKIT_CACHE_ROOT: ${{ vars.BUILDKIT_CACHE_ROOT || '/cache/buildkit' }}
  # 三份后端产物走 runner 本地目录交接,不走 artifact 上传/下载:
  # artifact 要过 GitHub blob storage,runner 出网一抖就 ECONNRESET 把发布带挂。
  RELEASE_ARTIFACT_ROOT: ${{ vars.RELEASE_ARTIFACT_ROOT || '/cache/rustpanel-artifacts' }}

jobs:
  verify:
    runs-on: [self-hosted, Linux, ARM64, m4-runner, rustpanel-runner]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Verify runner Bun
        run: bun --revision
      - run: rustup component add rustfmt clippy
      - run: ./scripts/verify-all.sh

  build-backend-image:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: [self-hosted, Linux, ARM64, m4-runner, rustpanel-runner]
    steps:
      - uses: actions/checkout@v7
      - id: backend-crate
        run: |
          if [ -f src/backend/Cargo.toml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare image repository
        if: steps.backend-crate.outputs.exists == 'true'
        id: image_ref
        run: |
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image_repository=ghcr.io/${owner_lc}/rustpanel-backend" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        if: steps.backend-crate.outputs.exists == 'true'
        with:
          node-version: '26'
      - name: Verify runner Bun
        if: steps.backend-crate.outputs.exists == 'true'
        run: bun --revision
      - name: Build root TypeScript scripts
        if: steps.backend-crate.outputs.exists == 'true'
        run: bun install --frozen-lockfile && bun run scripts:build
      - name: Warm Docker base image cache
        if: steps.backend-crate.outputs.exists == 'true'
        run: scripts/warm-docker-base-images.sh src/backend/Dockerfile
      - name: Validate backend image BuildKit cache
        if: steps.backend-crate.outputs.exists == 'true'
        env:
          CACHE_PATH: ${{ env.BUILDKIT_CACHE_ROOT }}/${{ env.BACKEND_IMAGE_CACHE_FAMILY }}/${{ env.BUILDKIT_CACHE_PROJECT }}/${{ env.BACKEND_IMAGE_CACHE_NAME }}
        run: node dist/node-scripts/scripts/validate-buildkit-local-cache.js --path "$CACHE_PATH" --quarantine --label backend-image
      - name: Collect backend image cache imports
        if: steps.backend-crate.outputs.exists == 'true'
        id: backend-cache
        env:
          LOCAL_CACHE_DEST: ${{ env.BUILDKIT_CACHE_ROOT }}/${{ env.BACKEND_IMAGE_CACHE_FAMILY }}/${{ env.BUILDKIT_CACHE_PROJECT }}/${{ env.BACKEND_IMAGE_CACHE_NAME }}-next-${{ github.run_id }}
          REGISTRY_CACHE: ${{ steps.image_ref.outputs.image_repository }}:buildcache
        run: |
          node dist/node-scripts/scripts/collect-buildkit-cache-imports.js \
            --cache-root "$BUILDKIT_CACHE_ROOT" \
            --family "$BACKEND_IMAGE_CACHE_FAMILY" \
            --project "$BUILDKIT_CACHE_PROJECT" \
            --cache-name "$BACKEND_IMAGE_CACHE_NAME" \
            --local-dest "$LOCAL_CACHE_DEST" \
            --registry-cache "$REGISTRY_CACHE" \
            --include-legacy-root-peers
      - name: Prepare backend image cache export
        if: steps.backend-crate.outputs.exists == 'true'
        env:
          NEXT_CACHE_PATH: ${{ env.BUILDKIT_CACHE_ROOT }}/${{ env.BACKEND_IMAGE_CACHE_FAMILY }}/${{ env.BUILDKIT_CACHE_PROJECT }}/${{ env.BACKEND_IMAGE_CACHE_NAME }}-next-${{ github.run_id }}
        run: |
          mkdir -p "$(dirname "$NEXT_CACHE_PATH")"
          find "$(dirname "$NEXT_CACHE_PATH")" -mindepth 1 -maxdepth 1 -type d -name "${BACKEND_IMAGE_CACHE_NAME}-next-*" -mtime +1 -exec rm -rf "{}" +
          rm -rf "$NEXT_CACHE_PATH"
      - uses: docker/setup-buildx-action@v4
        if: steps.backend-crate.outputs.exists == 'true'
        with:
          name: rustpanel-backend-image-builder
          keep-state: true
          cleanup: false
          cache-binary: false
      - uses: docker/login-action@v4
        if: steps.backend-crate.outputs.exists == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        if: steps.backend-crate.outputs.exists == 'true'
        with:
          builder: rustpanel-backend-image-builder
          context: .
          file: src/backend/Dockerfile
          target: runtime
          platforms: ${{ env.BACKEND_IMAGE_PLATFORM }}
          push: true
          tags: |
            ${{ steps.image_ref.outputs.image_repository }}:latest
            ${{ steps.image_ref.outputs.image_repository }}:sha-${{ github.sha }}
          cache-from: ${{ steps.backend-cache.outputs.cache-from }}
          cache-to: ${{ steps.backend-cache.outputs.cache-to }}
          # 顺带 load 到本地:发布用的 full 二进制直接从刚构建好的镜像里取,
          # 不走 registry 往返(runner ↔ ghcr.io 抖动会把发布卡死)。
          load: true
      - name: Export full backend binary
        if: steps.backend-crate.outputs.exists == 'true'
        env:
          IMAGE: ${{ steps.image_ref.outputs.image_repository }}:sha-${{ github.sha }}
        run: |
          rm -rf dist/backend-binary
          mkdir -p dist/backend-binary
          # 不 docker pull:镜像就是本机刚 push 的那份(load: true)
          container="$(docker create --platform ${{ env.BACKEND_IMAGE_PLATFORM }} "$IMAGE")"
          docker cp "$container:/app/rustpanel-backend" dist/backend-binary/rustpanel-backend
          docker rm "$container" >/dev/null
          file dist/backend-binary/rustpanel-backend
      - name: Publish full backend binary
        if: steps.backend-crate.outputs.exists == 'true'
        run: |
          target="$RELEASE_ARTIFACT_ROOT/${{ github.run_id }}/backend-binary"
          mkdir -p "$target"
          cp dist/backend-binary/rustpanel-backend "$target/rustpanel-backend"
          ls -l "$target/rustpanel-backend"
      - name: Promote backend image BuildKit cache
        if: success() && steps.backend-crate.outputs.exists == 'true'
        env:
          CACHE_PATH: ${{ env.BUILDKIT_CACHE_ROOT }}/${{ env.BACKEND_IMAGE_CACHE_FAMILY }}/${{ env.BUILDKIT_CACHE_PROJECT }}/${{ env.BACKEND_IMAGE_CACHE_NAME }}
          NEXT_CACHE_PATH: ${{ env.BUILDKIT_CACHE_ROOT }}/${{ env.BACKEND_IMAGE_CACHE_FAMILY }}/${{ env.BUILDKIT_CACHE_PROJECT }}/${{ env.BACKEND_IMAGE_CACHE_NAME }}-next-${{ github.run_id }}
          PREVIOUS_CACHE_PATH: ${{ env.BUILDKIT_CACHE_ROOT }}/${{ env.BACKEND_IMAGE_CACHE_FAMILY }}/${{ env.BUILDKIT_CACHE_PROJECT }}/${{ env.BACKEND_IMAGE_CACHE_NAME }}-prev
        run: |
          if [ ! -d "$NEXT_CACHE_PATH" ]; then
            echo "No backend image cache export found at $NEXT_CACHE_PATH"
            exit 0
          fi

          rm -rf "$PREVIOUS_CACHE_PATH"
          if [ -d "$CACHE_PATH" ]; then
            mv "$CACHE_PATH" "$PREVIOUS_CACHE_PATH"
          fi
          mv "$NEXT_CACHE_PATH" "$CACHE_PATH"
          rm -rf "$PREVIOUS_CACHE_PATH"
      - name: Summarize backend image
        if: always() && steps.backend-crate.outputs.exists == 'true'
        env:
          CACHE_IMPORTS: ${{ steps.backend-cache.outputs.summary }}
          CACHE_PATH: ${{ env.BUILDKIT_CACHE_ROOT }}/${{ env.BACKEND_IMAGE_CACHE_FAMILY }}/${{ env.BUILDKIT_CACHE_PROJECT }}/${{ env.BACKEND_IMAGE_CACHE_NAME }}
          NEXT_CACHE_PATH: ${{ env.BUILDKIT_CACHE_ROOT }}/${{ env.BACKEND_IMAGE_CACHE_FAMILY }}/${{ env.BUILDKIT_CACHE_PROJECT }}/${{ env.BACKEND_IMAGE_CACHE_NAME }}-next-${{ github.run_id }}
        run: |
          {
            echo "### Backend image"
            echo "- BuildKit cache: \`$CACHE_PATH\`"
            echo "- BuildKit cache export: \`$NEXT_CACHE_PATH\`"
            if [ -n "$CACHE_IMPORTS" ]; then
              echo "- BuildKit cache sources:"
              printf '%s\n' "$CACHE_IMPORTS" | while IFS= read -r source; do
                [ -n "$source" ] && echo "  - \`$source\`"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - if: steps.backend-crate.outputs.exists != 'true'
        run: echo "src/backend/Cargo.toml not found; skipping backend image build."

  # micro 二进制与镜像并行构建;完整版二进制不再单独编译,发布时直接从刚推送的镜像里取
  build-micro-binary:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: [self-hosted, Linux, ARM64, m4-runner, rustpanel-runner]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
        with:
          name: rustpanel-backend-binary-builder
          keep-state: true
          cleanup: false
          cache-binary: false
      - name: Build linux/amd64 micro backend binary
        run: |
          rm -rf dist/backend-binary-micro
          mkdir -p dist/backend-binary-micro
          docker buildx build \
            --builder rustpanel-backend-binary-builder \
            --platform linux/amd64 \
            --target binary-export \
            --build-arg BACKEND_CARGO_FLAGS=--no-default-features \
            --output type=local,dest=dist/backend-binary-micro \
            -f src/backend/Dockerfile .
          ls -l dist/backend-binary-micro/rustpanel-backend
      - name: Publish micro backend binary
        run: |
          target="$RELEASE_ARTIFACT_ROOT/${{ github.run_id }}/backend-binary-micro"
          mkdir -p "$target"
          cp dist/backend-binary-micro/rustpanel-backend "$target/rustpanel-backend"
          ls -l "$target/rustpanel-backend"

  # Alpine/OpenRC 主机用的 musl 静态二进制,只建 micro 档——128MB 级小鸡这次
  # 唯一的目标场景,full 档在 Alpine 上没有实际需求,不陪跑一份浪费 CI 时间。
  build-musl-binary:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: [self-hosted, Linux, ARM64, m4-runner, rustpanel-runner]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
        with:
          name: rustpanel-backend-binary-builder
          keep-state: true
          cleanup: false
          cache-binary: false
      - name: Build linux/amd64 musl micro backend binary
        run: |
          rm -rf dist/backend-binary-musl
          mkdir -p dist/backend-binary-musl
          docker buildx build \
            --builder rustpanel-backend-binary-builder \
            --platform linux/amd64 \
            --target binary-export-musl \
            --build-arg BACKEND_CARGO_FLAGS=--no-default-features \
            --output type=local,dest=dist/backend-binary-musl \
            -f src/backend/Dockerfile .
          ls -l dist/backend-binary-musl/rustpanel-backend
      - name: Publish musl backend binary
        run: |
          target="$RELEASE_ARTIFACT_ROOT/${{ github.run_id }}/backend-binary-musl"
          mkdir -p "$target"
          cp dist/backend-binary-musl/rustpanel-backend "$target/rustpanel-backend"
          ls -l "$target/rustpanel-backend"

  publish-binaries:
    if: github.event_name != 'pull_request'
    needs: [build-backend-image, build-micro-binary, build-musl-binary]
    runs-on: [self-hosted, Linux, ARM64, m4-runner, rustpanel-runner]
    steps:
      - uses: actions/checkout@v7
      - name: Collect backend binaries
        env:
          RUN_DIR: ${{ env.RELEASE_ARTIFACT_ROOT }}/${{ github.run_id }}
        run: |
          rm -rf dist/backend-binary dist/backend-binary-micro dist/backend-binary-musl
          for variant in backend-binary backend-binary-micro backend-binary-musl; do
            src="$RUN_DIR/$variant/rustpanel-backend"
            if [ ! -f "$src" ]; then
              echo "缺少后端产物: $src" >&2
              exit 1
            fi
            mkdir -p "dist/$variant"
            cp "$src" "dist/$variant/rustpanel-backend"
          done
          ls -l dist/backend-binary/rustpanel-backend dist/backend-binary-micro/rustpanel-backend dist/backend-binary-musl/rustpanel-backend
      - name: Prune stale backend binaries
        if: always()
        run: |
          # 只留最近一天:每轮发布三份二进制加起来约 35MB
          find "$RELEASE_ARTIFACT_ROOT" -mindepth 1 -maxdepth 1 -type d -mtime +1 -exec rm -rf {} + 2>/dev/null || true
      - name: Package release archives
        run: |
          rm -rf dist/release
          mkdir -p dist/release
          chmod +x dist/backend-binary/rustpanel-backend dist/backend-binary-micro/rustpanel-backend dist/backend-binary-musl/rustpanel-backend
          # 部署脚本随二进制一起发布:升级时二进制与单元脚本版本一致
          for dir in dist/backend-binary dist/backend-binary-micro dist/backend-binary-musl; do
            mkdir -p "$dir/deploy"
            cp deploy/systemd-units.sh deploy/update.sh "$dir/deploy/"
          done
          tar -C dist/backend-binary -czf dist/release/rustpanel-backend-linux-amd64.tar.gz rustpanel-backend deploy
          tar -C dist/backend-binary-micro -czf dist/release/rustpanel-backend-micro-linux-amd64.tar.gz rustpanel-backend deploy
          tar -C dist/backend-binary-musl -czf dist/release/rustpanel-backend-micro-linux-musl-amd64.tar.gz rustpanel-backend deploy
          ls -l dist/backend-binary/rustpanel-backend dist/backend-binary-micro/rustpanel-backend dist/backend-binary-musl/rustpanel-backend
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Verify runner Bun
        run: bun --revision
      - name: Build release scripts
        run: bun install --frozen-lockfile && bun run scripts:build
      - name: Publish micro binary release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node dist/node-scripts/scripts/publish-micro-release.js --asset dist/release/rustpanel-backend-linux-amd64.tar.gz
          node dist/node-scripts/scripts/publish-micro-release.js \
            --asset dist/release/rustpanel-backend-micro-linux-amd64.tar.gz \
            --asset-name rustpanel-backend-micro-linux-amd64.tar.gz
          node dist/node-scripts/scripts/publish-micro-release.js \
            --asset dist/release/rustpanel-backend-micro-linux-musl-amd64.tar.gz \
            --asset-name rustpanel-backend-micro-linux-musl-amd64.tar.gz
