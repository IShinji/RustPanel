[package]
name = "rustpanel-backend"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "rustpanel-backend"
path = "src/main.rs"

# 按需编译:默认 = 全功能。micro 构建(128MB 小鸡)用
#   cargo build --release --no-default-features
# 去掉 Docker API(bollard)、MySQL/Postgres 驱动、Redis 客户端和 portable-pty;
# 终端改走内置的 openpty 实现,数据库只留 SQLite。
[features]
default = ["docker", "mysql", "postgres", "redis", "pty"]
docker = ["dep:bollard"]
mysql = ["sqlx/mysql"]
postgres = ["sqlx/postgres"]
redis = ["dep:redis"]
pty = ["dep:portable-pty"]

[dependencies]
axum = { version = "0.7", features = ["multipart", "ws"] }
bollard = { version = "0.17", optional = true }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
daemonize = "0.5"
data-encoding = "2.11"
flate2 = "1"
futures-core = "0.3"
futures-util = "0.3"
hmac = "0.12"
# systemd socket activation 给 fd 打 CLOEXEC 用;tokio 早已依赖,不增体积。
libc = "0.2"
http-body-util = "0.1"
# 只用 ring:默认的 aws-lc-rs 与 reqwest/tokio-rustls 带进来的 ring 同时存在时,
# rustls 无法自动选 CryptoProvider,ACME 一发起 TLS 就 panic(panic=abort 直接崩进程)。
# 顺带去掉 aws-lc-rs 这个大 C 库。
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls"] }
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
mime_guess = "2"
portable-pty = { version = "0.8", optional = true }
prost = "0.13"
prost-types = "0.13"
rcgen = "0.13"
redis = { version = "0.27", default-features = false, features = ["tokio-comp"], optional = true }
regex = "1"
# 通知告警出站 HTTP(Webhook/Telegram/钉钉/企业微信/Bark)。走 rustls + 内置根证书,
# 不引 openssl,适配最小镜像;复用已在树里的 rustls/hyper。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rust-embed = "8"
# 启动时显式安装进程级 CryptoProvider(见 main.rs),防依赖变动再引入双 provider。
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha1 = "0.10"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["any", "json", "runtime-tokio", "sqlite"] }
sysinfo = "0.30"
tar = "0.4"
tera = "1"
thiserror = "2"
# rcgen 0.13 内部就用 time;直接 depend 一份对齐版本,设 not_after 用。
time = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tonic = "0.12"
tonic-web = "0.12"
tower = { version = "0.5", features = ["make", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"

[dev-dependencies]
tempfile = "3"
