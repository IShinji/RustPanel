[package]
name = "rustpanel-backend"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "rustpanel-backend"
path = "src/main.rs"

# 按需编译:默认 = 全功能。micro 构建(128MB 小鸡)用
#   cargo build --release --no-default-features
# 去掉 Docker API(bollard)、MySQL/Postgres 驱动、Redis 客户端和 portable-pty;
# 终端改走内置的 openpty 实现,数据库只留 SQLite。
[features]
default = ["docker", "mysql", "postgres", "redis", "pty"]
docker = ["dep:bollard"]
mysql = ["sqlx/mysql"]
postgres = ["sqlx/postgres"]
redis = ["dep:redis"]
pty = ["dep:portable-pty"]

[dependencies]
axum = { version = "0.8", features = ["multipart", "ws"] }
bollard = { version = "0.21", optional = true }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
daemonize = "0.5"
data-encoding = "2.11"
flate2 = "1"
futures-core = "0.3"
futures-util = "0.3"
hmac = "0.13"
# systemd socket activation 给 fd 打 CLOEXEC 用;tokio 早已依赖,不增体积。
libc = "0.2"
http-body-util = "0.1"
# 只用 ring:默认的 aws-lc-rs 与 reqwest/tokio-rustls 带进来的 ring 同时存在时,
# rustls 无法自动选 CryptoProvider,ACME 一发起 TLS 就 panic(panic=abort 直接崩进程)。
# 顺带去掉 aws-lc-rs 这个大 C 库。
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls"] }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
mime_guess = "2"
portable-pty = { version = "0.9", optional = true }
prost = "0.14"
prost-types = "0.14"
rcgen = "0.14"
# 两步验证绑定时生成 otpauth 二维码(纯 Rust SVG 渲染,不带图片编码依赖)
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
redis = { version = "1.0", default-features = false, features = ["tokio-comp"], optional = true }
regex = "1"
# 通知告警出站 HTTP(Webhook/Telegram/钉钉/企业微信/Bark)。走 rustls + 内置根证书,
# 不引 openssl,适配最小镜像;复用已在树里的 rustls/hyper。
# 0.13 起证书验证默认换成了 rustls-platform-verifier——Linux 上靠系统
# ca-certificates 包发现信任链,这跟低配主机方针冲突(精简镜像可能没装这个包)。
# rustls-no-provider 只开 rustls 后端、不带任何 CryptoProvider(实测确认不会像
# 公开的 "rustls" feature 那样偷偷拉 aws-lc-rs),配合 http_client.rs 手动接入
# 的、基于 webpki-roots 的 TLS 配置(不依赖系统证书包,跟升级前行为等价)。
# form/query 这两个老版本隐式可用的便利方法,0.13 里拆成了独立 feature。
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "stream", "form", "query"] }
rust-embed = "8"
# 启动时显式安装进程级 CryptoProvider(见 main.rs),防依赖变动再引入双 provider。
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha1 = "0.11"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["any", "json", "runtime-tokio", "sqlite"] }
sysinfo = "0.39"
tar = "0.4"
tera = "2"
thiserror = "2"
# rcgen 0.13 内部就用 time;直接 depend 一份对齐版本,设 not_after 用。
time = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tonic = "0.14"
tonic-web = "0.14"
tower = { version = "0.5", features = ["make", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
# 给 http_client.rs 手搓 rustls ClientConfig 用,见那边的注释
webpki-roots = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.14"

[dev-dependencies]
tempfile = "3"
